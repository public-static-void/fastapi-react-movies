name: Test Python FastAPI Backend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/movies_backend
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (derived from poetry.lock)
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.2.1 poetry-plugin-export==1.10.1
          poetry check --lock
          tmp="$(mktemp)"
          poetry export -f requirements.txt --output "$tmp" --with dev
          pip install -r "$tmp"
      - name: Run tests
        run: |
          pytest
