version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend/movies_backend"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/frontend/movies_frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
